name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (embedded Postgres)
        run: npm run test:integration

      - name: Build
        run: npm run build

  postgres:
    name: Integration tests on real PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the integration suite on PostgreSQL
        run: |
          set -o pipefail
          npm run test:postgres 2>&1 | tee pg.log
      - name: Report failure output as an annotation
        if: failure()
        run: |
          # Annotations are readable without signing in, unlike raw logs.
          echo "::error title=test:postgres output::$(grep -vE '^\s*$' pg.log | tail -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

  deploy-smoke:
    name: Docker image + compose stack, black-box tested
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only on main and pull requests: building the image is the slowest job.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    env:
      POSTGRES_PASSWORD: ci-only-password
      APP_URL: http://localhost:3000
      # The black-box suite simulates many clients via X-Forwarded-For, as a proxy would set it.
      TRUST_PROXY: "true"
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start the stack (db, migrate, web, worker)
        # Not "--wait": it reports the one-shot migrate container's normal exit (code 0) as a failure.
        # Instead check migrate succeeded and wait for web's healthcheck ourselves.
        run: |
          docker compose up -d --build web worker
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq migrate)")" = "0"
          timeout 120 sh -c 'until [ "$(docker inspect --format "{{.State.Health.Status}}" "$(docker compose ps -q web)")" = healthy ]; do sleep 2; done'
      - name: Black-box suite against the running stack
        run: BLACKBOX_URL=http://localhost:3000 npm run test:blackbox
      - name: Worker is running and ticking
        run: |
          sleep 40
          docker compose ps worker
          test "$(docker compose ps worker --format '{{.State}}')" = "running"
          test "$(docker inspect --format '{{.RestartCount}}' "$(docker compose ps -q worker)")" = "0"
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
          for svc in worker migrate web; do
            echo "::error title=${svc} logs::$( (docker compose ps -a "$svc"; docker compose logs --no-color --tail 40 "$svc") 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          done
      - name: Stop
        if: always()
        run: docker compose down -v
